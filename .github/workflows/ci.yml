name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test React 18 compatibility
        if: matrix.react == '18'
        run: npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
      - run: npm test
      - run: npm pack --dry-run
        if: matrix.node == '24' && matrix.react == '19'
